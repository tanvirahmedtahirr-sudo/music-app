<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(255,140,0,.25)}body{margin:0;background:#0d0d0d;color:#eee;font-family:sans-serif;padding-bottom:80px}header{background:linear-gradient(135deg,#ff8c00,#ff4500);padding:24px 16px 16px;text-align:center}header h1{margin:0;color:#fff;font-size:24px}nav{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}nav button{padding:9px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;font-weight:bold;font-size:13px}nav button.on{background:#fff;color:#ff4500}.wrap{padding:16px}input{width:100%;padding:14px 18px;border-radius:24px;border:none;font-size:15px}#srow{display:flex;gap:8px;margin-top:10px}#srow button{flex:1;padding:14px;border-radius:24px;border:none;font-weight:bold}#go{background:#fff;color:#ff4500}li{background:#1c1c1e;margin:10px 0;padding:10px;border-radius:14px;display:flex;align-items:center;gap:12px;list-style:none}li:active{background:#2a2a2c}img{border-radius:10px}.t{font-weight:bold;font-size:15px}.a{color:#999;font-size:13px}.star,.del{margin-left:auto;font-size:22px;background:none;border:none;padding:6px;color:#ff6a4d}#msg{text-align:center;color:#888;padding:30px 10px}#player{position:fixed;bottom:0;left:0;right:0;background:#1c1c1e;border-top:2px solid #ff4500;padding:10px 14px;display:none;align-items:center;gap:12px;z-index:9}#player img{border-radius:8px}#pp,#pc{background:#ff4500;color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:18px}#pc{background:#333}#pmeta{flex:1;overflow:hidden}#pt{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pa{color:#999;font-size:12px}#aud{display:none}.two{display:flex;gap:8px}.two input{flex:1}
</style></head>
<body>
<header><h1>🎵 My Music App</h1>
<nav><button id="tbs" class="on" onclick="tab('s')">Search</button><button id="tbb" onclick="tab('b')">🇧🇩 Bangla</button><button id="tbf" onclick="tab('f')">★ <span id="fcount">0</span></button></nav></header>
<div id="vs"><div class="wrap"><input id="q" placeholder="গান বা শিল্পী খুঁজুন..." onkeydown="if(event.key=='Enter')go()"><div id="srow"><button id="go" onclick="go()">🔍 Search</button></div></div></div>
<div id="vb" style="display:none"><div class="wrap"><div class="two"><input id="bt" placeholder="গানের নাম"></div><div class="two" style="margin-top:8px"><input id="ba" placeholder="শিল্পীর নাম"><button id="go" onclick="addB()" style="padding:14px 22px;border-radius:24px;border:none;font-weight:bold;background:#fff;color:#ff4500">＋ Add</button></div></div></div>
<div id="vf" style="display:none"><p id="msg">Loading...</p></div>
<ul id="out" style="padding:0;margin:16px"></ul>
<div id="player"><img id="pimg" width="46" height="46"><div id="pmeta"><div id="pt"></div><div id="pa"></div></div><button id="pp" onclick="pp()">▶</button><button id="pc" onclick="stop()">✕</button></div>
<audio id="aud"></audio>
<script>
var favLinks=[],view="s";
function loadFav(){return fetch("/favorites").then(r=>r.json()).then(d=>{favLinks=d.map(x=>x.link);document.getElementById("fcount").textContent=favLinks.length})}
function tab(v){view=v;document.getElementById("vs").style.display=v=="s"?"block":"none";document.getElementById("vb").style.display=v=="b"?"block":"none";document.getElementById("vf").style.display=v=="f"?"block":"none";document.getElementById("tbs").className=v=="s"?"on":"";document.getElementById("tbb").className=v=="b"?"on":"";document.getElementById("tbf").className=v=="f"?"on":"";if(v=="b")showB();if(v=="f")showFav()}
function openSong(s){if(s.prev){play(s)}else{window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(s.t+" "+s.a))}}
function play(s){var au=document.getElementById("aud"),pl=document.getElementById("player");au.src=s.prev;au.play();pl.style.display="flex";document.getElementById("pimg").src=s.img;document.getElementById("pt").textContent=s.t;document.getElementById("pa").textContent=s.a;document.getElementById("pp").textContent="⏸"}
function pp(){var au=document.getElementById("aud");if(au.paused){au.play();document.getElementById("pp").textContent="⏸"}else{au.pause();document.getElementById("pp").textContent="▶"}}
function stop(){var au=document.getElementById("aud");au.pause();au.src="";document.getElementById("player").style.display="none"}
function toggle(s){var rem=favLinks.indexOf(s.link)>-1;fetch("/fav",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({t:s.t,a:s.a,img:s.img,link:s.link,remove:rem})}).then(()=>{loadFav();draw(window._last||[])})}
function draw(d){var o=document.getElementById("out");o.innerHTML="";if(!d.length){o.innerHTML='<li style="display:block;background:none"><p id="msg">কিছু পাওয়া যায়নি 🎵</p></li>';return}d.forEach(s=>{var l=document.createElement("li");var row=document.createElement("div");row.style.cssText="display:flex;flex:1;align-items:center;gap:12px;cursor:pointer";row.onclick=function(){openSong(s)};if(s.img){var im=document.createElement("img");im.src=s.img;im.width=56;im.height=56;row.appendChild(im)}var dv=document.createElement("div");dv.innerHTML='<span class="t">'+s.t+'</span><br><span class="a">'+s.a+'</span>';row.appendChild(dv);l.appendChild(row);if(view=="b"){var del=document.createElement("button");del.className="del";del.textContent="✕";del.onclick=function(e){e.stopPropagation();delB(s)};l.appendChild(del)}else{var b=document.createElement("button");b.className="star";b.innerHTML=favLinks.indexOf(s.link)>-1?"⭐":"☆";b.onclick=function(e){e.stopPropagation();toggle(s)};l.appendChild(b)}o.appendChild(l)})}
function go(){var q=document.getElementById("q").value;document.getElementById("out").innerHTML='<li style="display:block;background:none"><p id="msg">⏳ খুঁজছি...</p></li>';fetch("/search?q="+encodeURIComponent(q)).then(r=>r.json()).then(d=>{window._last=d;draw(d)})}
function showFav(){loadFav().then(()=>fetch("/favorites").then(r=>r.json()).then(d=>{window._last=d;document.getElementById("out").innerHTML="";document.getElementById("msg").textContent=d.length?"":"এখনো কোনো Favorite নেই — Search ট্যাবে গিয়ে ☆ চাপুন!";draw(d)}))}
function showB(){fetch("/bangla").then(r=>r.json()).then(d=>{window._last=d;document.getElementById("out").innerHTML="";document.getElementById("msg").textContent=d.length?"":"নিচে গানের নাম-শিল্পী লিখে ＋ Add চাপুন!";draw(d)})}
function addB(){var t=document.getElementById("bt").value.trim(),a=document.getElementById("ba").value.trim();if(!t)return;fetch("/bangla",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({t:t,a:a})}).then(r=>r.json()).then(d=>{document.getElementById("bt").value="";document.getElementById("ba").value="";window._last=d;draw(d)})}
function delB(s){fetch("/bangla/remove",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({t:s.t,a:s.a})}).then(r=>r.json()).then(d=>{window._last=d;draw(d)})}
loadFav();document.getElementById("aud").addEventListener("ended",stop);
</script></body></html>
